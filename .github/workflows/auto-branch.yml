name: Auto Create Branch on In Branch

on:
  projects_v2_item:
    types: [edited]

jobs:
  create-branch:
    runs-on: ubuntu-latest
    if: github.event.projects_v2_item.content_type == 'Issue'
    steps:
      - name: Check status and create branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN }}
          script: |
            const TARGET_OWNER = 'SinsaFlower';
            const TARGET_REPO = 'app';
            const itemNodeId = context.payload.projects_v2_item.node_id;

            // 현재 아이템 상태와 이슈 정보 조회
            const result = await github.graphql(`
              query($nodeId: ID!) {
                node(id: $nodeId) {
                  ... on ProjectV2Item {
                    fieldValueByName(name: "Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue {
                        name
                      }
                    }
                    content {
                      ... on Issue {
                        number
                        title
                        labels(first: 10) {
                          nodes { name }
                        }
                      }
                    }
                  }
                }
              }
            `, { nodeId: itemNodeId });

            const status = result.node.fieldValueByName?.name;
            const issue = result.node.content;

            if (status !== 'In branch') {
              console.log(`Status is "${status}", skipping.`);
              return;
            }

            // 라벨 기반 브랜치 prefix 결정
            const labels = issue.labels.nodes.map(l => l.name);
            let prefix = 'feat';
            if (labels.includes('bug')) prefix = 'fix';
            else if (labels.includes('refactor')) prefix = 'refactor';
            else if (labels.includes('chore')) prefix = 'chore';

            // 브랜치명 생성: feat/{issue-number}-{sanitized-title}
            const sanitized = issue.title
              .trim()
              .replace(/[^\w\uAC00-\uD7A3\uAC00-\uD7A30-9\s-]/g, '')
              .replace(/\s+/g, '-')
              .replace(/-+/g, '-')
              .toLowerCase();
            const branchName = `${prefix}/${issue.number}-${sanitized}`;

            // develop 브랜치 SHA 조회
            let developSha;
            try {
              const develop = await github.rest.git.getRef({
                owner: TARGET_OWNER,
                repo: TARGET_REPO,
                ref: 'heads/develop',
              });
              developSha = develop.data.object.sha;
            } catch (e) {
              core.setFailed(`develop 브랜치를 찾을 수 없습니다: ${e.message}`);
              return;
            }

            // 브랜치 중복 확인
            try {
              await github.rest.git.getRef({
                owner: TARGET_OWNER,
                repo: TARGET_REPO,
                ref: `heads/${branchName}`,
              });
              console.log(`브랜치 "${branchName}" 이미 존재합니다. 건너뜁니다.`);
              return;
            } catch {
              // 존재하지 않으면 정상 진행
            }

            // 브랜치 생성
            await github.rest.git.createRef({
              owner: TARGET_OWNER,
              repo: TARGET_REPO,
              ref: `refs/heads/${branchName}`,
              sha: developSha,
            });

            console.log(`브랜치 생성 완료: ${branchName} (from develop@${developSha.slice(0, 7)})`);

            // 이슈에 코멘트 추가
            await github.rest.issues.createComment({
              owner: TARGET_OWNER,
              repo: TARGET_REPO,
              issue_number: issue.number,
              body: `🌿 브랜치가 자동 생성되었습니다: \`${branchName}\`\n\n> develop 기반으로 생성되었습니다.`,
            });
